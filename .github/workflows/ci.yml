name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job names ("check" and "docker") are what the protection rule on main waits for: keep them.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Roadmaps are valid and manifest.json is up to date
        run: |
          python3 tools/roadkit.py check
          if ! git diff --exit-code manifest.json; then
            echo "::error file=manifest.json::manifest.json is out of date. Run 'python3 tools/roadkit.py index' and commit it."
            exit 1
          fi

      - name: Interface texts are complete
        run: |
          python3 - <<'PY'
          import json, re, pathlib, sys
          labels = {p.stem: json.loads(p.read_text("utf-8")) for p in pathlib.Path("src/labels").glob("*.json")}
          base = labels["pt-BR"]
          bad = False
          for name, d in labels.items():
              for k in sorted(set(base) ^ set(d)):
                  print(f"::error::label '{k}' is in only one of pt-BR and {name}")
                  bad = True
          html = pathlib.Path("index.html").read_text("utf-8")
          for k in sorted(set(re.findall(r'data-i18n(?:-title|-aria|-placeholder)?="([^"]+)"', html))):
              if k not in base:
                  print(f"::error::index.html uses the label '{k}', which does not exist")
                  bad = True
          sys.exit(1 if bad else 0)
          PY

      - name: The validator catches broken projects
        run: |
          python3 - <<'PY'
          import json, sys
          sys.path.insert(0, "tools")
          import roadkit
          rm = json.load(open("examples/en/minimal.json", encoding="utf-8"))
          rm["projects"] = [
              {"id": "a", "title": "A", "level": "expert", "uses": ["nope"]},
              {"id": "a", "title": "B", "level": "beginner", "requirements": [{"id": "r", "title": "x"}, {"id": "r", "title": "y"}]},
          ]
          errs, _ = roadkit.validate(rm, roadkit.label_keys())
          text = "\n".join(errs)
          for needle in ("'level' must be one of", "uses 'nope'", "duplicate project id", "duplicate requirement id"):
              assert needle in text, f"missing error: {needle}\n{text}"
          print("ok")
          PY

      - name: The GitHub Pages site builds, with the demo
        run: |
          node --check site/site.js
          node --check site/i18n.js
          python3 tools/build_site.py /tmp/site --version 0.0.0
          python3 - <<'PY'
          import json, re, pathlib, sys
          site = pathlib.Path("/tmp/site")
          html = (site / "index.html").read_text("utf-8")
          bad = [u for u in re.findall(r'(?<![\w-])(?:src|href|srcset)="([^"#:]+)"', html) if not (site / u.split("?")[0]).exists() and not u.endswith("/")]
          assert not bad, f"missing files: {bad}"
          assert "v0.0.0" in html and "__ROADKIT_VERSION__" not in html
          m = json.loads((site / "app/manifest.json").read_text("utf-8"))
          assert m["demo"] is True and m["roadmaps"] and all(r["group"].startswith("examples/") for r in m["roadmaps"]), m["groups"]
          assert all((site / "app" / r["file"]).exists() for r in m["roadmaps"])
          assert (site / "app/sw.js").exists() and "__ROADKIT_VERSION__" not in (site / "app/sw.js").read_text("utf-8")
          en, pt = (re.findall(r"(?:^|[{,])\s*(\w+): '", block, re.M) for block in re.split(r"'pt-BR': \{", (pathlib.Path("site/i18n.js")).read_text("utf-8")))
          assert set(en) == set(pt), set(en) ^ set(pt)
          print("site ok")
          PY

      - name: JavaScript and Python parse
        run: |
          node --check src/app.js
          node --check src/markdown.js
          node tools/markdown.test.cjs
          python3 -m py_compile tools/roadkit.py

      - name: Server smoke test
        run: |
          export ROADKIT_DATA="$(mktemp -d)"
          python3 tools/roadkit.py serve --port 8765 &
          pid=$!
          trap 'kill $pid' EXIT
          for i in $(seq 40); do curl -sf http://127.0.0.1:8765/manifest.json >/dev/null && break; sleep 0.25; done
          H='Content-Type: application/json'

          curl -sf http://127.0.0.1:8765/ | grep -q "Roadkit"
          curl -sf http://127.0.0.1:8765/manifest.json | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['roadmaps'], 'no roadmaps listed'"

          # validate, create, read back, save progress, delete
          curl -sf -X POST -H "$H" --data-binary @examples/en/minimal.json http://127.0.0.1:8765/api/validate | python3 -c "import json,sys; r=json.load(sys.stdin); assert not r['errors'], r"
          sed 's/"minimal-example"/"ci-smoke"/' examples/en/minimal.json | curl -sf -X POST -H "$H" --data-binary @- "http://127.0.0.1:8765/api/roadmaps?category=ci"
          curl -sf http://127.0.0.1:8765/manifest.json | python3 -c "import json,sys; m=json.load(sys.stdin); assert any(r['id']=='ci-smoke' and r['group']=='roadmaps/ci' for r in m['roadmaps']), 'created roadmap missing'"
          curl -sf http://127.0.0.1:8765/user/ci/ci-smoke.json | python3 -c "import json,sys; assert json.load(sys.stdin)['id']=='ci-smoke'"
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 1, "state": {"nodes": {"first": "finished"}, "tasks": {}}}' http://127.0.0.1:8765/api/state/ci-smoke
          curl -sf http://127.0.0.1:8765/api/state/ci-smoke | grep -q finished

          # project progress is stored, and a client that only knows nodes and tasks does not erase it
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 2, "state": {"nodes": {"first": "finished"}, "tasks": {}, "projects": {"p1": {"status": "working", "repo": "https://example.com/r", "req": {"a": true}, "stretch": {"s": true}}}}}' http://127.0.0.1:8765/api/state/ci-smoke
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 3, "state": {"nodes": {}, "tasks": {}}}' http://127.0.0.1:8765/api/state/ci-smoke
          curl -sf http://127.0.0.1:8765/api/state/ci-smoke | python3 -c "import json,sys; s=json.load(sys.stdin)['state']; assert s['projects']['p1']['status']=='working' and s['projects']['p1']['stretch']=={'s': True} and s['nodes']=={}, s"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" -d '{"updatedAt": 4, "state": {"projects": {"p1": {"repo": "javascript:alert(1)"}}}}' http://127.0.0.1:8765/api/state/ci-smoke)" = 400
          curl -sf http://127.0.0.1:8765/api/activity/ci-smoke | python3 -c "import json,sys; a=json.load(sys.stdin); assert a['topics']['project:p1']['started'] and 'finished' not in a['topics']['first'], a"

          # activity: a first upload is not counted, a change lands on the client's day (tz), old days become months
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 1700000000000, "tz": 180, "state": {"nodes": {"first": "working"}, "tasks": {}}}' http://127.0.0.1:8765/api/state/ci-act
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/activity/ci-act)" = 204
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 1700000100000, "tz": 180, "state": {"nodes": {"first": "finished"}, "tasks": {"first/t": "finished"}}}' http://127.0.0.1:8765/api/state/ci-act
          curl -sf http://127.0.0.1:8765/api/activity/ci-act | python3 -c "import json,sys; a=json.load(sys.stdin); assert a['days']=={'2023-11-15': {'moves': 2, 'done': 1}}, a; t=a['topics']['first']; assert t=={'touched': 1700000100000, 'started': '2023-11-15', 'finished': '2023-11-15'}, t"
          curl -sf -X PUT -H "$H" -d "{\"updatedAt\": $(date +%s)000, \"state\": {\"nodes\": {\"first\": \"review\"}, \"tasks\": {}}}" http://127.0.0.1:8765/api/state/ci-act
          curl -sf http://127.0.0.1:8765/api/activity/ci-act | python3 -c "import json,sys; a=json.load(sys.stdin); assert a['months']['2023-11']=={'moves': 2, 'done': 1} and '2023-11-15' not in a['days'] and len(a['days'])==1, a; assert 'finished' not in a['topics']['first'], a"
          curl -sf "http://127.0.0.1:8765/api/activity?days=7" | python3 -c "import json,sys; a=json.load(sys.stdin); r=a['roadmaps']['ci-act']; assert r['last'] > 1700000100000 and sum(d['moves'] for d in a['days'].values()) >= 1, a"
          curl -sf http://127.0.0.1:8765/api/states | python3 -c "import json,sys; s=json.load(sys.stdin); assert s['ci-smoke']['projects']=={'p1': {'status': 'working'}} and 'tasks' in s['ci-act'], s"

          # changes made offline land on the day they happened (events), unless the time is before the last sync
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 1699617600000, "tz": 0, "state": {"nodes": {}, "tasks": {}}}' http://127.0.0.1:8765/api/state/ci-ev >/dev/null
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 1699790400000, "tz": 0, "state": {"nodes": {"a": "finished", "b": "working", "c": "working"}, "tasks": {}}, "events": [{"id": "a", "t": 1699704000000}, {"id": "c", "t": 1699531200000}, {"id": "x", "t": "soon"}]}' http://127.0.0.1:8765/api/state/ci-ev >/dev/null
          curl -sf http://127.0.0.1:8765/api/activity/ci-ev | python3 -c "import json,sys; a=json.load(sys.stdin); assert a['days']=={'2023-11-11': {'moves': 1, 'done': 1}, '2023-11-12': {'moves': 2}}, a; assert a['topics']['a']['finished']=='2023-11-11' and a['topics']['c']['started']=='2023-11-12', a"
          curl -sf "http://127.0.0.1:8765/api/activity?days=7" | python3 -c "import json,sys; r=json.load(sys.stdin)['roadmaps']['ci-ev']; assert r['first']=='2023-11-11' and r['total']=={'moves': 3, 'done': 1} and r['days']=={}, r"

          # focus sessions add up on the topic and on the day; odd payloads are refused
          now="$(date +%s)000"
          curl -sf -X POST -H "$H" -d "{\"id\": \"first\", \"min\": 25, \"t\": $now}" http://127.0.0.1:8765/api/activity/ci-act/focus | python3 -c "import json,sys; r=json.load(sys.stdin); assert r=={'id': 'first', 'focus': 25, 'sessions': 1}, r"
          curl -sf -X POST -H "$H" -d "{\"id\": \"first\", \"min\": 5, \"t\": $now}" http://127.0.0.1:8765/api/activity/ci-act/focus >/dev/null
          curl -sf http://127.0.0.1:8765/api/activity/ci-act | python3 -c "import json,sys; a=json.load(sys.stdin); t=a['topics']['first']; assert t['focus']==30 and t['sessions']==2 and sum(d.get('focus', 0) for d in a['days'].values())==30, a"
          for body in '{"id": "first", "min": 0, "t": 1}' '{"id": "../x", "min": 5, "t": 1}' '{"id": "first", "min": 601, "t": 1}' '{"id": "first", "min": true, "t": 1}'; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H "$H" -d "$body" http://127.0.0.1:8765/api/activity/ci-act/focus)" = 400 || { echo "::error::focus accepted $body"; exit 1; }
          done

          # spaced review: one file, newest copy wins, items checked
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/review)" = 204
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 2, "on": true, "skip": ["ci-act"], "items": {"ci-smoke:first": {"due": "2026-11-02", "step": 1}}}' http://127.0.0.1:8765/api/review >/dev/null
          curl -sf http://127.0.0.1:8765/api/review | python3 -c "import json,sys; r=json.load(sys.stdin); assert r['on'] is True and r['skip']==['ci-act'] and r['items']['ci-smoke:first']=={'due': '2026-11-02', 'step': 1}, r"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" -d '{"updatedAt": 1, "items": {}}' http://127.0.0.1:8765/api/review)" = 409
          for body in '{"updatedAt": 3, "items": {"x:y": {"due": "2026-13-01", "step": 0}}}' '{"updatedAt": 3, "items": {"nocolon": {"due": "2026-01-01", "step": 0}}}' '{"updatedAt": 3, "items": {"x:y": {"due": "2026-01-01", "step": -1}}}' '{"updatedAt": 3, "on": "yes"}'; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" -d "$body" http://127.0.0.1:8765/api/review)" = 400 || { echo "::error::review accepted $body"; exit 1; }
          done

          # notes: saved and read back, empty ones dropped, size and key limits, newer server copy wins
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 5, "notes": {"node:first": "# Hi\n<script>x</script>", "roadmap": "general", "node:other": "  "}}' http://127.0.0.1:8765/api/notes/ci-smoke
          curl -sf http://127.0.0.1:8765/api/notes/ci-smoke | python3 -c "import json,sys; n=json.load(sys.stdin)['notes']; assert n=={'node:first': '# Hi\n<script>x</script>', 'roadmap': 'general'}, n"
          python3 -c "import json; print(json.dumps({'updatedAt': 6, 'notes': {'node:first': 'x' * 20001}}))" > /tmp/long.json
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" --data-binary @/tmp/long.json http://127.0.0.1:8765/api/notes/ci-smoke)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" -d '{"updatedAt": 6, "notes": {"../x": "y"}}' http://127.0.0.1:8765/api/notes/ci-smoke)" = 400
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" -d '{"updatedAt": 1, "notes": {}}' http://127.0.0.1:8765/api/notes/ci-smoke)" = 409

          curl -sf -X DELETE "http://127.0.0.1:8765/api/roadmaps/ci-smoke?progress=1"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/state/ci-smoke)" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/notes/ci-smoke)" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/api/activity/ci-smoke)" = 204
          # the app can be installed and opened offline: the worker is served from the root with its version,
          # the manifest has the right type and its icons exist, and the worker never answers /api/ itself
          curl -sf -D /tmp/sw.h http://127.0.0.1:8765/sw.js -o /tmp/sw.js
          grep -qi '^service-worker-allowed: /' /tmp/sw.h
          grep -qi '^content-type: text/javascript' /tmp/sw.h
          ! grep -q '__ROADKIT_VERSION__' /tmp/sw.js
          grep -q "path.startsWith('api/')" /tmp/sw.js
          node --check /tmp/sw.js
          curl -sf -D /tmp/wm.h http://127.0.0.1:8765/src/manifest.webmanifest | python3 -c "import json,sys; m=json.load(sys.stdin); assert m['display']=='standalone' and m['icons'], m"
          grep -qi '^content-type: application/manifest+json' /tmp/wm.h
          for i in icon.svg favicon.svg icon-192.png icon-512.png maskable-512.png apple-touch-icon.png; do curl -sf -o /dev/null "http://127.0.0.1:8765/src/icons/$i"; done
          # writes from another origin are refused
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PUT -H "$H" -H 'Origin: http://evil.example' -d '{}' http://127.0.0.1:8765/api/state/x)" = 403
          # the data folder and the server code are never served as files, however the path is spelled
          curl -sf -X PUT -H "$H" -d '{"updatedAt": 1, "state": {"nodes": {}, "tasks": {}}}' http://127.0.0.1:8765/api/state/ci-peek
          for p in /data/ci-peek.json /%64ata/ci-peek.json /x/../data/ci-peek.json /%74ools/roadkit.py /.git/HEAD; do
            test "$(curl -s --path-as-is -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765$p")" = 404 || { echo "::error::$p is served"; exit 1; }
            test "$(curl -s --path-as-is -I -o /dev/null -w '%{http_code}' "http://127.0.0.1:8765$p")" = 404 || { echo "::error::HEAD $p is served"; exit 1; }
          done

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: The image builds and answers
        run: |
          docker build -t roadkit:ci .
          docker run -d --name rk -p 8765:8765 roadkit:ci
          for i in $(seq 40); do curl -sf http://127.0.0.1:8765/manifest.json >/dev/null && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8765/manifest.json | python3 -c "import json,sys; assert json.load(sys.stdin)['roadmaps']"
          docker rm -f rk
