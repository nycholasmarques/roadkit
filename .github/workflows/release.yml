name: Release

# Push a tag like v1.2.3 and this publishes the release, with the notes taken from
# CHANGELOG.md, a source zip, and a Docker image on ghcr.io.
# To redo a release for a tag that already exists, run it by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release again (for example v1.0.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Check the tag
        id: v
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: The tag points at a commit that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-list -n 1 "$TAG")"
          ok="$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --jq '[.check_runs[] | select(.name=="check" and .conclusion=="success")] | length' || echo unknown)"
          if [ "$ok" = "0" ]; then
            echo "::warning::No successful 'check' run found for $sha. Releasing anyway, but look at the CI tab."
          fi

      - name: Release notes from CHANGELOG.md
        id: notes
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          python3 - <<'PY'
          import os, re, pathlib
          v = os.environ["VERSION"]
          text = pathlib.Path("CHANGELOG.md").read_text("utf-8")
          m = re.search(r"^## \[" + re.escape(v) + r"\][^\n]*\n(.*?)(?=^## \[|^\[[^\]]+\]: |\Z)", text, re.S | re.M)
          body = m.group(1).strip() if m else ""
          pathlib.Path("notes.md").write_text(body + "\n" if body else "", "utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"found={'true' if body else 'false'}\n")
          if not body:
              print(f"::warning::CHANGELOG.md has no section for {v}; the notes will be generated from the commits.")
          PY

      - name: Source zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir dist
          git archive --format=zip --prefix="roadkit-$VERSION/" -o "dist/roadkit-$VERSION.zip" "$TAG"
          (cd dist && sha256sum "roadkit-$VERSION.zip" > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Roadkit ${{ steps.v.outputs.version }}
          body_path: ${{ steps.notes.outputs.found == 'true' && 'notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.found != 'true' }}
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          files: |
            dist/roadkit-${{ steps.v.outputs.version }}.zip
            dist/SHA256SUMS

  docker:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
          flavor: latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
