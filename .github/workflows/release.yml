name: Release

# Two ways to publish a version, both end up here:
#   1. Push a tag like v1.2.3.
#   2. Actions > Release > Run workflow, typing 1.2.3. It creates the tag v1.2.3 on the branch
#      you ran it from (or, if that tag already exists, releases it again).
# The release body is built by .github/scripts/release_notes.py: your CHANGELOG.md section,
# if there is one, plus every commit since the previous release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without the v, for example 1.2.3. Creates the tag v1.2.3 if it does not exist yet."
        required: true

permissions:
  contents: read

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      checks: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: v
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a version tag like v1.2.3 or v1.2.3-rc.1"; exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Create the tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "The tag $TAG already exists: releasing it again."
            git checkout -q "$TAG"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Roadkit ${TAG#v}"
            git push origin "refs/tags/$TAG"
          fi

      - name: The tag points at a commit that passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-list -n 1 "$TAG")"
          ok="$(gh api "repos/${{ github.repository }}/commits/$sha/check-runs" --jq '[.check_runs[] | select(.name=="check" and .conclusion=="success")] | length' || echo unknown)"
          if [ "$ok" = "0" ]; then
            echo "::warning::No successful 'check' run found for $sha. Releasing anyway, but look at the CI tab."
          fi

      - name: Release notes
        run: python3 .github/scripts/release_notes.py "$TAG" "${{ github.repository }}" > notes.md

      - name: Source zip
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          mkdir dist
          git archive --format=zip --prefix="roadkit-$VERSION/" -o "dist/roadkit-$VERSION.zip" "$TAG"
          (cd dist && sha256sum "roadkit-$VERSION.zip" > SHA256SUMS)

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Roadkit ${{ steps.v.outputs.version }}
          body_path: notes.md
          prerelease: ${{ steps.v.outputs.prerelease == 'true' }}
          files: |
            dist/roadkit-${{ steps.v.outputs.version }}.zip
            dist/SHA256SUMS

  docker:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=semver,pattern={{major}},value=${{ env.TAG }}
          flavor: latest=auto

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
