<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7fb">
  <title>Roadkit</title>
  <script>try{var m=localStorage.getItem('roadkit:v1:theme'),s=m==='dark'||(m!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light',p=localStorage.getItem('roadkit:v1:palette-'+s),k={light:['light','mist','paper'],dark:['night','graphite','plum','black']}[s];document.documentElement.dataset.theme=s;document.documentElement.dataset.palette=k.indexOf(p)>=0?p:k[0];var f={small:.95,normal:1.1,large:1.25,xlarge:1.4}[localStorage.getItem('roadkit:v1:fs')];if(f)document.documentElement.style.setProperty('--fs',f);if(localStorage.getItem('roadkit:v1:side')==='collapsed')document.documentElement.dataset.side='collapsed';var w=parseInt(localStorage.getItem('roadkit:v1:sidew'),10);if(w)document.documentElement.style.setProperty('--side-open',Math.min(Math.max(w,200),420)+'px')}catch(e){}</script>
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="app">
  <aside>
    <div class="side-top">
      <div class="logo" id="logo"></div>
      <button type="button" class="side-toggle" id="sideToggle" aria-expanded="true" aria-controls="phaseNav">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M10 3.5L5.5 8 10 12.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
    <div class="side-sub" id="tagline"></div>
    <div class="roadmap-switch">
      <div class="aside-label" data-i18n="roadmaps"></div>
      <button type="button" class="rm-current" id="rmBtn" aria-haspopup="true" aria-expanded="false" aria-controls="rmPop">
        <span class="rm-ico" id="rmIcon" aria-hidden="true"></span>
        <span class="rm-name" id="rmName"></span>
        <span class="rm-chip" id="rmChip"></span>
        <svg class="rm-chev" viewBox="0 0 12 12" width="11" height="11" aria-hidden="true"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="rm-pop" id="rmPop" hidden></div>
    </div>
    <div class="aside-label" data-i18n="journey"></div>
    <nav id="phaseNav"></nav>
    <div class="tools">
      <div class="aside-label" data-i18n="tools"></div>
      <button class="nav-btn" data-act="new" data-i18n-title="newRoadmap" data-i18n-aria="newRoadmap"><svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg><span class="nav-lbl" data-i18n="newRoadmap"></span></button>
      <button class="nav-btn" data-act="notes" data-i18n-title="notesAll" data-i18n-aria="notesAll"><svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3.5h10l4 4V20.5H5z"/><path d="M8.5 11h7M8.5 15h4.5"/></svg><span class="nav-lbl" data-i18n="notesAll"></span></button>
      <button class="nav-btn" data-act="export" data-i18n-title="exportTitle" data-i18n-aria="exportTitle"><svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 20h14"/></svg><span class="nav-lbl" data-i18n="exportProgress"></span></button>
      <button class="nav-btn" data-act="import" data-i18n-title="importTitle" data-i18n-aria="importTitle"><svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V5m0 0L8 9m4-4l4 4M5 20h14"/></svg><span class="nav-lbl" data-i18n="importProgress"></span></button>
      <button class="nav-btn" data-act="reset" data-i18n-title="resetProgress" data-i18n-aria="resetProgress"><svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.6-5.9M4 4.5V9h4.5"/></svg><span class="nav-lbl" data-i18n="resetProgress"></span></button>
      <button class="nav-btn" data-act="open" data-i18n-title="openFile" data-i18n-aria="openFile"><svg class="nav-ico" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7zM14 3v4h4"/></svg><span class="nav-lbl" data-i18n="openFile"></span></button>
    </div>
    <div class="aside-foot">
      <div class="aside-bottom" id="sidebarNote"></div>
      <div class="credit credit-side"><span data-i18n="madeBy"></span> <a href="https://github.com/nycholasmarques" target="_blank" rel="noopener noreferrer">nycholasmarques</a> <span class="credit-sep">|</span> <a href="https://github.com/nycholasmarques/roadkit" target="_blank" rel="noopener noreferrer" data-i18n="sourceCode"></a></div>
    </div>
  </aside>
  <div class="side-grip" id="sideGrip" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="resizeSide"></div>
  <section class="editor-pane" id="editorPane" hidden aria-labelledby="editTitle">
    <div class="ep-head">
      <button type="button" class="secondary" id="edBack"><span aria-hidden="true">←</span> <span data-i18n="edBack"></span></button>
      <h2 id="editTitle"></h2>
      <div class="seg small" id="editMode" role="group"><button type="button" data-mode="form" data-i18n="edForm"></button><button type="button" data-mode="json" data-i18n="edJson"></button></div>
      <button type="button" class="secondary" id="edAi" data-i18n="aiOpen"></button>
      <button type="button" class="secondary ep-toggle" id="edPreviewBtn" data-i18n="edPreview"></button>
    </div>
    <div class="ep-cat"><label for="edCat" data-i18n="edCategory"></label><select id="edCat"></select><input type="text" id="edCatNew" hidden data-i18n-placeholder="edCategoryName"></div>
    <div class="ep-body" id="editBody"></div>
    <div class="ep-foot">
      <div class="ed-lint" id="editLint" aria-live="polite"></div>
      <div class="dlg-err" id="editErr" role="alert"></div>
      <button type="button" class="secondary" id="edCancel" data-i18n="rmCancel"></button>
      <button type="button" class="primary" id="editSave" data-i18n="edSave"></button>
    </div>
  </section>
  <button type="button" class="primary ed-back-edit" id="edBackEdit" data-i18n="edEditBack"></button>
  <main class="workspace">
    <header class="toolbar" id="toolbar">
      <div class="top-left">
        <div class="eyebrow" id="eyebrow"></div>
        <h1 id="title">Roadkit</h1>
        <p id="subtitle"></p>
      </div>
      <div class="controls">
        <div class="progress-wrap">
          <div class="progress-txt"><span data-i18n="progress"></span><span id="progressText">0 / 0</span></div>
          <div class="bar"><div class="bar-fill" id="barFill"></div></div>
        </div>
        <input id="search" type="search" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchAria">
        <button class="secondary" id="nextBtn" data-i18n="nextTopic"></button>
        <button class="primary" id="startBtn" data-i18n="start"></button>
      </div>
      <div class="tb-actions">
        <div class="seg" id="viewSeg" role="group" data-i18n-aria="viewSwitch">
          <button type="button" data-view="map" aria-pressed="true" data-i18n="viewMap"></button>
          <button type="button" data-view="kanban" aria-pressed="false" data-i18n="viewKanban"></button>
          <button type="button" data-view="projects" aria-pressed="false" data-i18n="viewProjects" id="viewProjects" hidden></button>
        </div>
        <button class="icon-btn" id="paletteBtn" type="button" data-i18n-aria="paletteOpen" data-i18n-title="paletteOpen">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        </button>
        <button class="icon-btn" id="settingsBtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="settings" data-i18n-aria="settings" data-i18n-title="settings">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="7" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="8" cy="17" r="2.3" fill="none" stroke="currentColor" stroke-width="2"/></svg>
        </button>
        <div class="settings" id="settings" hidden role="group" data-i18n-aria="settings">
          <div class="set-row"><span class="set-label" data-i18n="theme"></span>
            <div class="seg small" id="themeSeg">
              <button type="button" data-theme-mode="auto" data-i18n="themeAuto"></button>
              <button type="button" data-theme-mode="light" data-i18n="themeLight"></button>
              <button type="button" data-theme-mode="dark" data-i18n="themeDark"></button>
            </div></div>
          <div class="set-row" id="paletteRow"><span class="set-label" data-i18n="palette"></span>
            <div class="pal-group" data-scheme="light"><span class="pal-sub" data-i18n="paletteLight"></span><div class="pal-grid"></div></div>
            <div class="pal-group" data-scheme="dark"><span class="pal-sub" data-i18n="paletteDark"></span><div class="pal-grid"></div></div></div>
          <div class="set-row"><span class="set-label" data-i18n="fontSize"></span>
            <div class="seg small" id="fontSeg">
              <button type="button" data-fs="small" class="fs-s" data-i18n="fontSmall"></button>
              <button type="button" data-fs="normal" class="fs-m" data-i18n="fontNormal"></button>
              <button type="button" data-fs="large" class="fs-l" data-i18n="fontLarge"></button>
              <button type="button" data-fs="xlarge" class="fs-xl" data-i18n="fontXLarge"></button>
            </div></div>
          <div class="set-row"><label class="set-label" for="langSel" data-i18n="language"></label>
            <div class="sel-wrap"><select id="langSel"></select></div></div>
          <div class="set-row"><label class="set-label" for="skipSel" data-i18n="skipWarn"></label>
            <div class="sel-wrap"><select id="skipSel">
              <option value="0" data-i18n="skipWarnAlways"></option>
              <option value="3" data-i18n="skipWarnUpTo3"></option>
              <option value="5" data-i18n="skipWarnUpTo5"></option>
              <option value="off" data-i18n="skipWarnNever"></option>
            </select></div>
            <span class="set-hint" data-i18n="skipWarnHint"></span></div>
          <div class="set-row"><label class="set-label" for="keysSel" data-i18n="shortcuts"></label>
            <div class="sel-wrap"><select id="keysSel">
              <option value="on" data-i18n="keysOnOpt"></option>
              <option value="off" data-i18n="keysOffOpt"></option>
            </select></div>
            <span class="set-hint" data-i18n="keysHint"></span></div>
          <p class="sync-note" id="syncStatus" aria-live="polite"></p>
          <div class="set-tools">
            <button type="button" class="secondary" data-act="new" data-i18n="newRoadmap"></button>
            <button type="button" class="secondary" data-act="notes" data-i18n="notesAll"></button>
            <button type="button" class="secondary" data-act="export" data-i18n="exportProgress"></button>
            <button type="button" class="secondary" data-act="import" data-i18n="importProgress"></button>
            <button type="button" class="secondary" data-act="reset" data-i18n="resetProgress"></button>
            <button type="button" class="secondary" data-act="open" data-i18n="openFile"></button>
          </div>
        </div>
      </div>
    </header>
    <section class="bodyline">
      <div class="map-viewport" id="mapViewport"><div class="map-frame" id="mapFrame"><div class="map" id="map"></div></div></div>
      <section class="board-wrap" id="boardWrap">
        <p class="board-hint" id="boardHint"></p>
        <div class="board" id="board" data-dnd-root></div>
      </section>
      <section class="projects-wrap" id="projects"></section>
      <div class="detail-grip" id="detailGrip" role="separator" aria-orientation="vertical" tabindex="0" data-i18n-aria="resizeDetail"></div>
      <section class="detail" id="detail" aria-live="polite">
        <button class="detail-close" id="detailClose" data-i18n-aria="close">×</button>
        <div id="detailContent" class="detail-placeholder"></div>
      </section>
    </section>
    <footer class="footer-note">
      <div id="footer"></div>
      <div class="credit credit-foot"><span data-i18n="madeBy"></span> <a href="https://github.com/nycholasmarques" target="_blank" rel="noopener noreferrer">nycholasmarques</a> <span class="credit-sep">|</span> <a href="https://github.com/nycholasmarques/roadkit" target="_blank" rel="noopener noreferrer" data-i18n="sourceCode"></a></div>
    </footer>
  </main>
</div>
<dialog class="dlg" id="manageDlg" aria-labelledby="manageTitle">
  <div class="dlg-in">
    <div class="dlg-head"><h2 id="manageTitle" data-i18n="manageRoadmaps"></h2><button type="button" class="dlg-x" data-close data-i18n-aria="rmClose">×</button></div>
    <div class="dlg-tools">
      <button type="button" class="primary" data-act="new" data-i18n="newRoadmap"></button>
      <button type="button" class="secondary" data-act="import" data-i18n="importProgress"></button>
    </div>
    <div class="dlg-body" id="manageBody"></div>
  </div>
</dialog>
<dialog class="cmdk" id="cmdk" data-i18n-aria="paletteOpen">
  <div class="cmdk-search">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
    <input id="cmdkInput" type="text" role="combobox" aria-expanded="true" aria-controls="cmdkList" aria-autocomplete="list" autocomplete="off" spellcheck="false" data-i18n-placeholder="paletteSearch" data-i18n-aria="paletteSearch">
    <button type="button" class="cmdk-close" id="cmdkClose" data-i18n-aria="rmClose" data-i18n-title="rmClose"><kbd>Esc</kbd></button>
  </div>
  <div class="cmdk-list" id="cmdkList" role="listbox" data-i18n-aria="paletteOpen"></div>
  <p class="cmdk-foot" data-i18n="paletteHint"></p>
</dialog>
<dialog class="dlg" id="keysDlg" aria-labelledby="keysTitle">
  <div class="dlg-in">
    <div class="dlg-head"><h2 id="keysTitle" data-i18n="shortcuts"></h2><button type="button" class="dlg-x" data-close data-i18n-aria="rmClose">×</button></div>
    <div class="dlg-body" id="keysBody"></div>
  </div>
</dialog>
<dialog class="dlg dlg-wide" id="notesDlg" aria-labelledby="notesTitle">
  <div class="dlg-in">
    <div class="dlg-head"><h2 id="notesTitle" data-i18n="notesAll"></h2><button type="button" class="secondary" id="notesCopy" data-i18n="notesCopy"></button><button type="button" class="dlg-x" data-close data-i18n-aria="rmClose">×</button></div>
    <div class="dlg-body notes-body" id="notesBody"></div>
  </div>
</dialog>
<dialog class="dlg dlg-wide" id="aiDlg" aria-labelledby="aiTitle">
  <div class="dlg-in">
    <div class="dlg-head"><h2 id="aiTitle" data-i18n="aiTitle"></h2><button type="button" class="dlg-x" data-close data-i18n-aria="rmClose">×</button></div>
    <div class="dlg-body ai-body">
      <p class="dlg-note" data-i18n="aiHow"></p>
      <h3 class="ai-h"><span>1</span> <b data-i18n="aiStep1"></b></h3>
      <label class="ed-f"><span data-i18n="aiGoal"></span><textarea id="aiGoal" rows="4" data-i18n-placeholder="aiGoalPh"></textarea></label>
      <div class="ai-row">
        <label class="ed-f"><span data-i18n="aiLang"></span><select id="aiLang"></select></label>
        <label class="ed-f"><span data-i18n="aiSize"></span><select id="aiSize"><option value="s" data-i18n="aiSizeS"></option><option value="m" data-i18n="aiSizeM" selected></option><option value="l" data-i18n="aiSizeL"></option></select></label>
      </div>
      <label class="ed-chk"><input type="checkbox" id="aiProjects" checked> <span data-i18n="aiProjects"></span></label>
      <h3 class="ai-h"><span>2</span> <b data-i18n="aiStep2"></b></h3>
      <textarea id="aiPrompt" class="ai-prompt" rows="7" readonly spellcheck="false" aria-label="Prompt"></textarea>
      <button type="button" class="primary" id="aiCopy" data-i18n="aiCopy"></button>
      <h3 class="ai-h"><span>3</span> <b data-i18n="aiStep3"></b></h3>
      <textarea id="aiAnswer" rows="6" spellcheck="false" data-i18n-placeholder="aiAnswerPh" aria-label="JSON"></textarea>
      <div class="dlg-err" id="aiErr" role="alert"></div>
      <button type="button" class="primary" id="aiUse" data-i18n="aiUse"></button>
    </div>
  </div>
</dialog>
<div class="scrim" id="scrim"></div>
<div class="dock" id="dock" hidden></div>
<input type="file" id="importFile" accept=".zip,.json,application/zip,application/json">
<input type="file" id="openFile" accept="application/json,.json">
<script src="src/markdown.js"></script>
<script src="src/app.js"></script>
</body>
</html>
