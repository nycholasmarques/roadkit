name: roadkit

services:
  roadmap:
    build: .
    image: roadkit:latest
    container_name: roadkit
    restart: unless-stopped
    init: true                    # proper SIGTERM handling, so `docker stop` is instant
    ports:
      # localhost only by default; set BIND_ADDR=0.0.0.0 in .env to expose on your LAN
      - "${BIND_ADDR:-127.0.0.1}:${PORT:-8765}:8765"
    volumes:
      # edit/add JSONs on the host and just reload the page: no rebuild needed
      - ./roadmaps:/app/roadmaps:ro
      # saved progress (one JSON per roadmap); a named volume keeps it across rebuilds and recreates
      - roadkit-data:/app/data
    environment:
      # optional: require this token to read/write progress (set it in .env when exposing on your LAN)
      ROADKIT_TOKEN: ${ROADKIT_TOKEN:-}
      # optional: other names you open Roadkit by (comma separated), e.g. roadkit.home or a Tailscale name.
      # localhost and IP addresses always work; any other name is refused by the API (DNS rebinding protection)
      ROADKIT_HOSTS: ${ROADKIT_HOSTS:-}
      # optional: the sync token, instead of pasting it in the settings (docs/en/sync.md).
      # With Docker secrets, use ROADKIT_SYNC_TOKEN_FILE: /run/secrets/<name> instead
      ROADKIT_SYNC_TOKEN: ${ROADKIT_SYNC_TOKEN:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m

volumes:
  roadkit-data:
